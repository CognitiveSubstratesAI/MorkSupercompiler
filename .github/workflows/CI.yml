name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # A job-level `permissions:` block REPLACES the default token scopes, so every scope a step
    # needs is listed: `id-token: write` lets codecov-action authenticate with GitHub OIDC (see the
    # upload step); `actions: write` lets julia-actions/cache delete old caches (its README).
    permissions:
      contents: read
      actions: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        version: ['1.13']
        os: [ubuntu-latest]
        arch: [x64]
    steps:
      - uses: actions/checkout@v4
      # MorkSupercompiler dev-links HPC + MORKTensorNetworks + MORK + PathMap via [sources]
      # (../HPC, ../MORKTensorNetworks, ../MORK, ../PathMap); MORKTensorNetworks + MORK in turn
      # dev-link ../MORK / ../PathMap. Clone all four siblings before instantiation.
      # 🔴 HPC MIGRATED TO THE ORG AND MADE PUBLIC 2026-09-27 — this clone now works anonymously.
      # The TODO that used to sit here ("once HPC is migrated") was the whole problem: the URL kept
      # pointing at sivaji1012/HPC, which is not anonymously clonable, so the step died with
      # "fatal: could not read Username for 'https://github.com'" (exit 128) and EVERY LATER STEP
      # WAS SKIPPED — buildpkg, runtest, processcoverage, codecov. MEASURED on Core: 30 of the last
      # 30 CI runs failed this way, back to at least 2026-09-17, so nothing had been CI-verified for
      # ten days and Codecov had never received a single upload. A TODO is not a gate; it recorded
      # the defect and changed nothing.
      - name: Clone path [sources] dependencies (siblings)
        run: |
          git clone --depth 1 https://github.com/CognitiveSubstratesAI/PathMap.git ../PathMap
          git clone --depth 1 https://github.com/CognitiveSubstratesAI/MORK.git ../MORK
          git clone --depth 1 https://github.com/CognitiveSubstratesAI/MORKTensorNetworks.git ../MORKTensorNetworks
          git clone --depth 1 https://github.com/CognitiveSubstratesAI/HPC.git ../HPC
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      # Coverage → Codecov. `julia-runtest` already runs with `coverage: true` by default; these two
      # steps turn the per-file `.cov` output into `lcov.info` and upload it. `fail_ci_if_error: false`
      # keeps a Codecov outage (or a missing token on a fork) from failing an otherwise green build.
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          # 🔴 THIS STEP HAD NEVER UPLOADED ANYTHING (fixed 2026-10-02). Its log read "Upload queued
          # for processing failed: Token required because branch is protected": the CODECOV_TOKEN
          # secret does not reach this repo, the token input was EMPTY, and `fail_ci_if_error: false`
          # showed green. Now: the secret when it exists, GitHub OIDC (`id-token: write`) when not —
          # OIDC proven first on LogicKernel (upload landed, a668c1c). A failed upload now fails CI.
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          fail_ci_if_error: true

  format:
    name: Format (Blue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      # No julia-actions/cache here — a cached Manifest can pin an older
      # JuliaFormatter than the pinned version, causing local/CI drift.
      - name: Check formatting
        run: |
          julia -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaFormatter", version="2.14.0"))'
          julia -e 'using JuliaFormatter; println("JuliaFormatter ", pkgversion(JuliaFormatter))'
          julia -e 'using JuliaFormatter; format(".")'
          if ! git diff --quiet; then
            echo "::error::Formatting check failed — files below are not Blue-formatted:"
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi
          echo "All files Blue-formatted."
